# ElasticMQ configuration — local SQS stand-in for Phase 3.
#
# Visibility timeouts DERIVED from the Phase 3 calibration sample (P3-1):
#   harness-jobs: 235s base (max observed 167s at n=2, custom_minimal only,
#                            + 2×34s heartbeat margin).  max not p95 — at n=2
#                            no percentile beyond min/median/max is defined (F4).
#   eval-jobs:    300s    (Phase 2 measured ~120s per grading; keep headroom)
#   results:      30s     (short — writes are sub-second)
#
# Sample caveat: n=2, harness-only, custom_minimal only (harness-in-isolation,
# not through the queue).  Aider/mini-swe-agent are unmeasured — their runs are
# subprocess CLIs and plausibly slower.  Phase 5 must re-derive from a fuller,
# queue-through sample; see design/calibration-note.md.
#
# The derivation and observed distribution are recorded in
# design/calibration-note.md.  Phase 5's Terraform must cite that note,
# not re-derive or re-guess these numbers.
#
# See ADR-0015, ADR-0006, architecture.md §5.1.

include classpath("application.conf")

queues {
  # ── Harness jobs ──────────────────────────────────────────────────
  harness-jobs {
    defaultVisibilityTimeout = 235 seconds
    receiveMessageWait = 20 seconds    # long polling
    deadLettersQueue {
      name = "harness-jobs-dlq"
      maxReceiveCount = 3
    }
  }
  harness-jobs-dlq { }

  # ── Eval jobs ─────────────────────────────────────────────────────
  eval-jobs {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "eval-jobs-dlq"
      maxReceiveCount = 3
    }
  }
  eval-jobs-dlq { }

  # ── Results ───────────────────────────────────────────────────────
  results {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 5 seconds
    deadLettersQueue {
      name = "results-dlq"
      maxReceiveCount = 3
    }
  }
  results-dlq { }

  # ── llm-calls (ADR-0037 / M0 §3) ──────────────────────────────────
  # The llm_calls.jsonl POINTER queue, consumed by the results-writer's
  # llm-calls daemon thread.  Short visibility (sub-second reads); the DLQ
  # catches a pointer whose S3 object cannot be read / bulk-insert keeps
  # failing.
  llm-calls {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "llm-calls-dlq"
      maxReceiveCount = 3
    }
  }
  llm-calls-dlq { }

  # ── model-observations (§6.6, autoscaler observation events) ──────
  # The live dispatcher's reconciliation_peak / overload / recovery_stabilized
  # events; the results-writer's observations daemon drains it and only ever
  # INSERTs into model_tpm_observations.
  model-observations {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "model-observations-dlq"
      maxReceiveCount = 3
    }
  }
  model-observations-dlq { }
}
