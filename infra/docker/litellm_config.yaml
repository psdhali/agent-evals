# LiteLLM Proxy configuration — Phase 2 local gateway.
#
# Model aliases are the indirection that makes F2 real: a run config references
# `model_name: cheap-oss-model`, not a provider or raw model ID.  Swapping the
# backing model is a config change here, not a code change anywhere.
#
# See architecture.md §4 and ADR-0002.

# drop_params lets a model silently ignore params it does not support (e.g. a
# non-thinking model receiving reasoning_effort), instead of raising a hard 400
# that would fail the harness run.  Measured live: qwen3-coder* returns normally
# (reasoning dropped), deepseek honours reasoning, laguna honours reasoning +
# temperature/top_k.
litellm_settings:
  drop_params: true

model_list:
  - model_name: cheap-oss-model
    litellm_params:
      # openrouter/ (not openai/) — the native provider forces usage.include on
      # every request and reads OpenRouter's OWN reported cost from the response
      # body (llms/openrouter/chat/transformation.py:163, :212), instead of
      # computing an approximation from a static price table it doesn't have.
      model: openrouter/deepseek/deepseek-v4-flash-0731
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 100
      tpm: 200000
    # Compaction build (Stage 4.2 / BUILD-SPEC §2): model_info on each alias is
    # what the dispatcher's window resolution reads (Stage 1.1 §2, live
    # /model/info max_input_tokens) — no window ever needs to touch an image.
    # The WINDOW is a property of the ENDPOINT: deepseek-v4-flash serves
    # 1 048 576.  max_output_tokens is the compaction build's fixed output
    # reserve (32 768), NOT the model's max_completion_tokens.
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 32768

  # Claude Code speaks Anthropic's /v1/messages wire format.  STEP 2 (review
  # 2026-08-26): use LiteLLM's ANTHROPIC ADAPTER (anthropic/ prefix +
  # custom_llm_provider: anthropic), NOT the openrouter/ translation — the old
  # translation was a translation, not a passthrough: LiteLLM converted
  # Anthropic→OpenAI chat, called OpenRouter, then reconstructed an Anthropic
  # body and DROPPED OpenRouter's `cost` and `provider` on the way back.  Result:
  # not one of 75 calls carried a cost field (cost_source fell back to
  # local_pricing by construction) and provider_name was never populated.  The
  # adapter returns both.
  #
  # api_base must NOT end in /v1: LiteLLM's Anthropic adapter appends
  # /v1/messages itself, so `https://openrouter.ai/api/v1` would become
  # `.../api/v1/v1/messages` -> HTTP 404.  Head-to-head in one container only the
  # base differing: `/api/v1` -> 404, `/api` -> 200 with provider + cost.
  - model_name: claude-code-model
    litellm_params:
      model: anthropic/deepseek/deepseek-v4-flash-0731
      custom_llm_provider: anthropic
      api_base: https://openrouter.ai/api
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 100
      tpm: 200000
    # Compaction build (Stage 4.2): see cheap-oss-model above.
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 32768

  # --- calibration / comparison models (builder 3, gateway-pinned settings) ---
  # Reasoning + generation params are pinned HERE, once, so every harness gives
  # each model a uniform request (fair harness-vs-harness comparison on the
  # model).  drop_params makes a non-supporting model ignore what it can't use.

  # 2026-08-28: qwen3-coder-next and laguna-xs-2.1 (and their -claude twins)
  # are FULLY MIGRATED off this file — no entry for either model remains
  # here, not even a generic fallback. Verified locally 2026-08-26 against a
  # real `ghcr.io/berriai/litellm:main-stable` container (D3): `/model/update`
  # REFUSES to edit a model that came from THIS file — "Model in config.
  # Store model in db via `/model/new` to edit." — even with
  # store_model_in_db: true. Declaring a rotatable alias here AND creating a
  # same-named db-model (the only way to make it rotatable) makes LiteLLM
  # register BOTH as deployments under one model_name, and the router load-
  # balances every request across them — so some fraction of a run's calls
  # would silently go out on the wrong (shared, un-rotated) key. A rotatable
  # alias must therefore exist ONLY as a db-model, never also here.
  #
  # Every harness that has actually been tested (custom_minimal, mini_swe_
  # agent, claude_code, codex, opencode) gets its own per-harness db-model
  # alias for BOTH models — <model>-<harness>, claude_code on the Anthropic
  # adapter, the other four on the OpenAI-shaped openrouter/ provider —
  # spec in swebench_eval/gateway/rotatable_models.py, reconciled into the
  # gateway's DB by control_plane/run_launch.py at first use (one
  # `/model/new` per alias, idempotent) or via scripts/reconcile_gateway_
  # models.py ahead of time. `aider` is deliberately OUT OF SCOPE (untested)
  # — no alias exists for it against either model, by design.
  #
  # Per-harness, not one shared alias per model, because the launch mutex
  # (run_launch._claim) keys on f"{harness}:{model_alias}" — two DIFFERENT
  # harnesses using the SAME model_alias are not blocked by it and can run
  # concurrently, but key rotation (/model/update) targets one db-model row
  # holding exactly one current OpenRouter key. A shared alias would let two
  # concurrent runs overwrite each other's rotated key. One row per
  # concurrently-launchable (harness, model) pair makes that impossible
  # rather than merely unlikely — see rotatable_models.py's module docstring
  # for the full reasoning.
  #
  # No yaml fallback is kept for either model on purpose — the only way to
  # be certain every run against qwen3-coder-next or laguna-xs-2.1 is using a
  # rotatable, per-run-keyed alias is for a non-rotatable escape hatch to not
  # exist at all.

  # deepseek-flash: reasoning model.  reasoning ONLY (no temperature / top_p /
  # top_k) as requested — the reasoning path cares about the chain-of-thought.
  - model_name: deepseek-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash-0731
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning_effort: "high"
      allowed_openai_params: ["reasoning_effort", "thinking"]
      rpm: 100
      tpm: 200000
    # Compaction build (Stage 4.2): deepseek-v4-flash serves a 1 048 576 window.
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 32768

router_settings:
  # Spec §1.1-§1.3 (2026-09-01): `enforce_model_rate_limits: true` was an INVALID bare boolean —
  # the proxy logged "not a valid argument for Router.__init__(). Ignoring this key." on every
  # boot, so no rpm/tpm counters ever existed. The valid form (deployed image, types/router.py)
  # is optional_pre_call_checks. Enforcement is ON so the COUNTERS exist (telemetry); the
  # per-model rpm/tpm are set high enough to never bind (a gateway 429 converts a capacity
  # problem into per-instance failures — an unlaunched task costs nothing). And router.py:493
  # only attaches Redis from EXPLICIT router_settings kwargs — REDIS_URL in the task env alone
  # is inert (confirmed: no Redis init in the boot log), so redis_url is wired here.
  optional_pre_call_checks: ["enforce_model_rate_limits"]
  redis_url: os.environ/REDIS_URL
  num_retries: 3
  # Owner decision 2026-09-03 (bring-up, found live): the router's cooldown turns ONE upstream
  # 429/401 on a replica into ~5 s of synthetic "No deployments available" 429s for EVERY
  # call on that replica. The pacer + shim were built to read real 429s; a synthetic storm
  # reads as fleet-wide overload (and a discovery probe measured it as the provider's burst
  # edge). Hand upstream status codes straight through — nothing here needs LiteLLM to
  # protect a deployment from us.
  disable_cooldowns: true

general_settings:
  # run-launch §5.2 / D3 (ADR-0035 decision 3): required for runtime
  # /model/update (upstream-key rotation onto an alias) and /key/generate
  # scoping — LiteLLM gates both on this being true
  # (model_management_endpoints.py).  This YAML stays the SEED: every gateway
  # deploy re-seeds the model rows from it, so what is in git is always what
  # runs (verified locally 2026-08-26 — see builder4-run-launch-response.md
  # for the exact behaviour observed in a local `litellm:main-stable`
  # container, since it was NOT verified before this line was written).
  store_model_in_db: true
  # Owner decision 2026-09-03: /model/update reloads ONLY the replica that handled it; every
  # other replica re-reads the DB on this timer (LiteLLM default 30 s, no sync endpoint —
  # verified in the v1.99.1 image). Two replicas behind the ALB meant a rotated key was
  # served by one and 401'd by the other for up to 30 s (judge task judge-017884817928…,
  # discovery probe 5702aa4c). 5 s bounds the stale window; every key-minting path
  # (launch / discovery / judge) then waits for 10 s of consecutive 200s across replicas
  # (gateway_admin.await_alias_served) before its first real call.
  proxy_config_reload_interval_seconds: 5
  # 5a-ii: in the deployed gateway the DB is Aurora `litellm_spend` (ADR-0022),
  # injected through the ECS DATABASE_URL secret — local compose sets the same
  # env var to its litellm-db. Never hardcode the compose host here again: a
  # hostname that only exists on a dev laptop is a silent "config loads, writes
  # go nowhere" failure in a container (same class as the ALB-port SG gap).
  database_url: os.environ/DATABASE_URL
  # M3 (review 2026-08-25): master-handover 1.1 / R8.2 — store full prompts +
  # responses in spend logs so a live run is readable (covers ALL five harnesses
  # uniformly at the gateway). MUST live under `general_settings`, NOT
  # `litellm_settings`: LiteLLM reads it from general_settings (verified at
  # proxy/_types.py:2499 ConfigGeneralSettings; proxy_server.py:6247
  # `"store_prompts_in_spend_logs" in _general_settings`). Unknown
  # litellm_settings keys are setattr'd and never read — so the old placement
  # was silently inert and tail_trajectory returned no prompt text.
  # Owner decision 2026-09-03: this stays ON for EVERY run, the 500s included —
  # the readable trajectory is worth the storage. (The earlier note here said to
  # turn it off before the 500 because prompt size grows monotonically in an
  # agent loop, so per-call storage is quadratic — ~252 GB, ~$25/mo in Aurora.
  # That estimate stands; the decision is to pay it.) Do not flip this.
  store_prompts_in_spend_logs: true